<!DOCTYPE html>
<html>

<head>
    <title>Streamit</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>

<body>

    <!-- Sidebar -->


    <div class="sidebar">

        <h1 class="logo">Streamit</h1>

        <a href="/home" class="nav-item active">
            <div class="icon-box">
                <i class="fa-solid fa-house"></i>
            </div>
            <span>Home</span>
        </a>

        <a href="/movies" class="nav-item">
            <div class="icon-box">
                <i class="fa-solid fa-film"></i>
            </div>
            <span>Movies</span>
        </a>

        <a href="/series" class="nav-item">
            <div class="icon-box">
                <i class="fa-solid fa-tv"></i>
            </div>
            <span>Series</span>
        </a>

        <a href="/history" class="nav-item">
            <div class="icon-box">
                <i class="fa-solid fa-clock-rotate-left"></i>
            </div>
            <span>History</span>
        </a>

        <a href="/logout" class="nav-item" style="margin-top: 50px;">
            <div class="icon-box">
                <i class="fa-solid fa-right-from-bracket"></i>
            </div>
            <span>Logout</span>
        </a>

    </div>


    <div class="main">

        <div class="topbar">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Search Movies">
            </div>



            <a href="/ai_recommendation" class="ai-btn">
                AI Recommendation
            </a>
        </div>

        <div class="hero">
            <div>
                <h1>AI Movie Recommendation</h1>
                <p>Discover multilingual movies and series.</p>
            </div>
        </div>

        <div class="language-bar">

            <a href="/home" class="lang-btn">All</a>

            <a href="/language/English" class="lang-btn">
                English
            </a>

            <a href="/language/Hindi" class="lang-btn">
                Hindi
            </a>

            <a href="/language/Tamil" class="lang-btn">
                Tamil
            </a>

            <a href="/language/Malayalam" class="lang-btn">
                Malayalam
            </a>

            <a href="/language/Korean" class="lang-btn">
                Korean
            </a>

            <a href="/language/Spanish" class="lang-btn">
                Spanish
            </a>

        </div>


        <h2 class="section-title">Trending Movies</h2>

        <div class="movie-grid" id="movieGrid">

            {% for movie in movies %}
            <a href="/movie/{{ movie.title | urlencode }}" class="movie-link">

                <div class="movie-card" onclick="saveHistory('{{ movie.title }}')">

                    <img
                        id="poster-{{ loop.index }}"
                        src="{{ movie.image }}"
                        data-title="{{ movie.title }}"
                        data-needs-fetch="{{ 'true' if movie.image == '/static/posters/default.jpg' else 'false' }}"
                        loading="lazy"
                        onerror="this.src='/static/posters/default.jpg'"
                    >

                    <div class="overlay">
                        <h3>{{ movie.title }}</h3>
                        <p>{{ movie.language }}</p>
                    </div>

                </div>

            </a>
            {% endfor %}

        </div>

    </div>





    <script src="{{ url_for('static', filename='script.js') }}"></script>

    <script>
        // ── Lazy Poster Loader ──────────────────────────────────
        // After the page is fully rendered, find all placeholder
        // images and fetch real posters one by one without
        // blocking the UI.

        document.addEventListener('DOMContentLoaded', function () {

            const placeholders = document.querySelectorAll(
                'img[data-needs-fetch="true"]'
            );

            if (placeholders.length === 0) return;

            console.log(`Lazy-loading ${placeholders.length} posters...`);

            // Stagger requests so we don't overwhelm the server / API
            placeholders.forEach(function (img, index) {

                setTimeout(function () {

                    const title = img.dataset.title;

                    fetch(`/api/poster/${encodeURIComponent(title)}`)
                        .then(r => r.json())
                        .then(data => {
                            if (data.poster && data.poster !== '/static/posters/default.jpg') {
                                // Smooth swap
                                img.style.opacity = '0';
                                img.src = data.poster;
                                img.onload = () => {
                                    img.style.transition = 'opacity 0.4s ease';
                                    img.style.opacity = '1';
                                    img.dataset.needsFetch = 'false';
                                };
                            }
                        })
                        .catch(() => {/* silently keep placeholder */ });

                }, index * 300); // 300ms gap between requests
            });
        });
    </script>

</body>

</html>
